<!DOCTYPE html>
<html>
<head>
<meta charset=UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>CSWM Videos</title>
  <style>
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px;padding:10px;}
  .photo-grid video{border-radius:10px; width:100%;height:350px;object-fit:cover;}
.scroll-box{white-space:nowrap;overflow-x:scroll;width:100%;height:auto;border-radius:10px;}
  .scroll-box video{display:inline-block;width:100%;height:auto;object-fit:cover;border-radius:10px;}
  </style>
</head>
<body>
  <div style="text-align:center; margin-bottom:10px;">
    <a href="index.html" style="color:red; font-weight:bold; text-decoration:none;">← Back to Home</a>
  </div>
  <div class="photo-grid">

    <div class="scroll-box">
      <video src="videos/V1.mp4" controls loop></video><
      <video src="videos/V2.mp4" controls></video>
      <video src="videos/V3.mp4" controls></video>
    </div>
      <video src="videos/P1.mp4" controls style="height:auto;"></video>
  </body>
</html>
