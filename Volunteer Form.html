<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Volunteer's Form</title>
  <style>
  form{
    background:white;
    border:3px solid blue;
    padding:24px;
    margin:20px auto;
  }
  h2{
    color:blue;
    text-align:center;
    margin-top:-10px;
    border:2px solid blue;
    font-family:fantasy;
    word-spacing:10px;
  }
  h2+p{
    color: white;
    display: inline-block;
    padding:12px 12px;
    border: 2px solid none;
    background: blue;
    font-size: 20px;
    margin-top:-10px;
    margin-bottom:1px;
    font-family: fantasy;
    font-weight:500;
    text-align: center;
    animation: move 9s linear infinite;
  }
  @keyframes move{
    0%,100% {transform: translateX(15px);}
    50% {transform: translateX(160px);}
  }
  label{
    font-weight: 600;
    display:block;
    margin-top: 12px;
  }
  input,select{
    background:white;
    border-radius:5px;
    width:100%;
    border:2px solid black;
    box-sizing: border-box;
    padding:10px;
    margin-top:2px;
    display:inline-block;
    height:auto;
  }
  input[type= "text"],input[type= "tel"], input[type="email"]{
    font-weight:bolder;
  }
  input::placeholder {
    font-size: 11px;
    font-family:fantasy;
    font-weight: bolder;
  }
  select{
    font-size:15px;
    font-weight:600;
  }
  .checkbox{
    margin-top:8px;
  }
  .checkbox label{
    display:block;
    font-weight:500;
    margin-top:5px;
    cursor:pointer;
  }
  input[type="checkbox"]{
    transform:scale(1.2);
    width: auto;
  }
  textarea{
    border:2px solid black;
    border-radius: 5px;
    width:100%;
    padding:10px;
    font-family: inherit;
    box-sizing:border-box;
    font-size:15px;
    margin-top:2px;
  }
  button{
    width:100%;
    padding:12px;
    margin-top:18px;
    background: blue;
    font-weight: bolder;
    color: white;
    font-size:15px;
    border-radius:30px;
    cursor: pointer;
    border:none;
  }
  </style>
</head>
<body>
    <div style="text-align:center; margin-bottom:10px;">
    <a href="index.html" style="color:black; font-weight:bold; text-decoration:none;">← Back to Home</a>
  </div>
  <form action ="https://formsubmit.co/samlaniyan7@gmail.com" method="POST">
    <div style="text-align:center;"> <img src="images/CSWM.png" style="max-width:70px; height:auto;margin-top:-10px; margin-bottom:20px;">
    </div>
    <h2>VOLUNTEER Sign Up</h2>
     <p>Welcome</p>
    <label>Full Name</label>
    <input type= "text" name="Full-Name" required>
    <label>Phone/Whatsapp</label>
    <input type= "tel" name="Phone" required>
    <label>Email</label>
    <input type= "email" name="Email" required>
    <label>Departments:</label>
    <div class="checkbox">
      <label><input type="checkbox" name="Department[]" value="Choir"><span>Choir</span></label>
      <label><input type="checkbox" name="Department[]" value="Ushering">Ushering</label>
      <label><input type="checkbox" name="Department[]" value="Drama">Drama</label>
      <label><input type="checkbox" name="Department[]" value="Media">Media</label>
      <label><input type="checkbox" name="Department[]" value="Sanitation">Sanitation</label>
      <label><input type="checkbox" name="Department[]" value="Follow-Up">Follow-Up</label>
      <label><input type="checkbox" name="Department[]" value="Technical">Technical</label>
      <label><input type="checkbox" name="Department[]" value="Instrumentalist">Instrumentalist</label>    
    </div>
    <label>Skills/Experience:</label>
    <input type= "text" name="Skills" placeholder="E.g I play guitar, I have done ushering before">
    <label>Feedbacks:</label>
    <textarea name="Feedbacks" id="Feedbacks" rows="4" placeholder="Any suggestions or feedbacks,you can comment inside here"></textarea>
    <label>Further Info:</label>
    <textarea name="Further-Info" id="Further-Info" rows="4" placeholder="Any other information can be added here"></textarea>
  <!-- CHANGE THIS EMAIL TO YOUR OWN -->
    <button type="submit">SUBMIT APPLICATION</button>
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="New Volunteer Signup">
  </form>
</body>
</html>
