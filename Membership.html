<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Church Membership Form</title>
  <style>
    body{ font-family: Arial; background:#f4f4f4; padding: 20px; }
    table { width: 100%; max-width: 900px; margin: auto; background: white; border-collapse: collapse; box-shadow: 0 0 10px #ccc;border: 1px solid #0a192f;}
    th { background: #0a192f; color: white; padding: 15px; text-align: center; font-size: 20px; border: 1px solid #0a192f;}
    td { padding: 12px; border: 1px solid #0a192f;}
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { background: #0a192f; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 10px 5px;display:grid;}
  </style>
</head>
<body>
  <div style="text-align:center; margin-bottom:10px;">
    <a href="index.html" style="color:red; font-weight:bold; text-decoration:none;">← Back to Home</a>
  </div>
  <div style="text-align:center;"> <img src="images/CSWM.png" style="max-width:70px; height:auto; margin-bottom:10px;">
    </div>
  <form action="https://formsubmit.co/cswmchurch26@gmail.com" method="POST">
  <input type= "hidden" name = "_captcha" value= "false">
  <input type= "text" name = "_honey" style= "display:none">  
    <table id="memberTable">
  <tr>
    <th>S/N</th><th>Full Name</th><th>Gender</th><th>Phone Number</th><th>Department</th>
  </tr>
<!-- Row 1 -->
  <tr>
    <td>1</td>
    <td><input type="text" name="FullName1" placeholder="Enter name" required></td>
    <td><select name="Gender1"><option value="">--</option><option>Male</option><option>Female</option></select></td>
    <td><input type="tel" name="Phone1" placeholder="080..."></td>
    <td><select name="Dept1"><option value="">--</option><option>Ushering</option><option>Choir</option><option>Media</option><option>Drama</option><option>Prayer Warrior</option>
    <option>Sanitation</option></select></td>
  </tr>     
  <tr>
    <td colspan="5">
      <button type="button" class="btn" onclick="addRow()">+ Add More Row</button>
      <button type="button" class="btn" onclick="deleteRow()">– Delete Row</button>
      <button type="submit" class="btn">Submit Register</button>
      <button type="button" class="btn" onclick="saveDraft()">Save</button>
      <button type="button" class="btn" onclick="loadDraft()">Load</button> 
    </td>
  </tr>
    </table>
    </form>
  <!--JavaScript starts here-->
    <script>
    let row = 2;
    const table = document.getElementById("memberTable");
    function addRow() {
      let newRow = table.insertRow(table.rows.length - 1);
      newRow.innerHTML = `<td>${row}</td><td><input type="text" name="FullName" placeholder="Enter name"></td>
      <td><select name="Gender"><option value="">--</option><option>Male</option><option>Female</option></select></td>
      <td><input type="tel" name="Phone" placeholder="080..."></td>
      <td><select name="Dept"><option value="">--</option><option>Ushering</option><option>Choir</option><option>Media</option><option>Drama</option><option>Prayer Warrior</option><option>Sanitation</option></select></td>`;
      row++;
    }
    function deleteRow() {
      let x = table.rows.length;
      if(x > 3){
        table.deleteRow(x-2);
        row--;
      } else {
        alert("You must have at least one member");
      }
    }
    // ===== SIMPLE SAVE AND LOAD FOR MULTIPLE ROWS =====
    function saveDraft() {
      let allRows = []; // this will hold all members
      for(let i = 1; i < table.rows.length - 1; i++){
        let r = table.rows[i];
        let member = {
          name: r.cells[1].querySelector("input").value,
          gender: r.cells[2].querySelector("select").value,
          phone: r.cells[3].querySelector("input").value,
          dept: r.cells[4].querySelector("select").value
        };
        allRows.push(member); // add this person to the list
      }
      localStorage.setItem("churchDraft", JSON.stringify(allRows)); // save the list
      alert("Draft Saved! " + allRows.length + " members saved");
    }
    function loadDraft() {
      let saved = localStorage.getItem("churchDraft");
      if(!saved){ alert("No saved draft found"); return; }
      let allRows = JSON.parse(saved); // get the list back
      while(table.rows.length > 3) table.deleteRow(2);
      for(let i = 0; i < allRows.length; i++){
        if(i > 0) addRow(); // add new row for member 2, 3, 4...
        let r = table.rows[i+1]; // +1 because row 0 is header
        let member = allRows[i];
        r.cells[1].querySelector("input").value = member.name;
        r.cells[2].querySelector("select").value = member.gender;
        r.cells[3].querySelector("input").value = member.phone;
        r.cells[4].querySelector("select").value = member.dept;
      }
      row = allRows.length + 1; // update row counter
      alert("Draft Loaded! " + allRows.length + " members loaded");
    }
  </script>
</body>
</html>
